name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_EVENT_TITLE: ${{ vars.VITE_EVENT_TITLE }}
  VITE_EVENT_DATE: ${{ vars.VITE_EVENT_DATE }}
  VITE_EVENT_TIME: ${{ vars.VITE_EVENT_TIME }}
  VITE_EVENT_DURATION: ${{ vars.VITE_EVENT_DURATION }}
  VITE_ACTIVITY_NAME: ${{ vars.VITE_ACTIVITY_NAME }}
  VITE_VOLUNTEER_TRACKING_URL: ${{ vars.VITE_VOLUNTEER_TRACKING_URL }}
  VITE_MAX_MESSAGE_LENGTH: ${{ vars.VITE_MAX_MESSAGE_LENGTH }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix api
      - name: Validate and build
        run: npm run check && npm run check:api && az bicep build --file infra/main.bicep

  deploy-function-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: deploy-api
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api
          remote-build: true
          respect-funcignore: true
      - name: Verify Function App health
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.VITE_API_BASE_URL }}/api/health"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-function-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build configured frontend
        env:
          VITE_AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          VITE_AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED }}
          VITE_CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          VITE_APPROVED_FOOTER_TEXT: ${{ vars.APPROVED_FOOTER_TEXT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm ci && npm run build
      - id: deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          VITE_AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED }}
          VITE_CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          VITE_APPROVED_FOOTER_TEXT: ${{ vars.APPROVED_FOOTER_TEXT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
      - name: Publish production URL
        run: |
          {
            echo '## Production deployment'
            echo ''
            echo '- **Application:** ${{ steps.deploy.outputs.static_web_app_url }}'
            echo '- **API:** ${{ vars.VITE_API_BASE_URL }}'
            echo '- **API health:** ${{ vars.VITE_API_BASE_URL }}/api/health'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PR_PREVIEWS == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build configured frontend
        env:
          VITE_AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          VITE_AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED }}
          VITE_CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          VITE_APPROVED_FOOTER_TEXT: ${{ vars.APPROVED_FOOTER_TEXT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm ci && npm run build
      - id: deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          VITE_AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED }}
          VITE_CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          VITE_APPROVED_FOOTER_TEXT: ${{ vars.APPROVED_FOOTER_TEXT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
      - name: Publish preview URL
        run: |
          {
            echo '## Preview deployment'
            echo ''
            echo '- **Pull request:** #${{ github.event.pull_request.number }}'
            echo '- **Application:** ${{ steps.deploy.outputs.static_web_app_url }}'
            echo '- **API:** ${{ vars.VITE_API_BASE_URL }}'
            echo '- **API health:** ${{ vars.VITE_API_BASE_URL }}/api/health'
          } >> "$GITHUB_STEP_SUMMARY"

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PR_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          action: close
          app_location: dist
