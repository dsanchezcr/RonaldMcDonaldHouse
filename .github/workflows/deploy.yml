name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, test, production]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix api
      - run: npm run build && npm run build --prefix api
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2.0.0
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environment=${{ vars.DEPLOYMENT_ENVIRONMENT }}
            staticWebAppName=${{ vars.STATIC_WEB_APP_NAME }}
            retentionDays=${{ vars.RETENTION_DAYS }}
            consentVersion=${{ vars.CONSENT_VERSION }}
            approvedFooterText="${{ vars.APPROVED_FOOTER_TEXT }}"
            allowedOrigins='${{ vars.ALLOWED_ORIGINS_JSON }}'
          failOnStdErr: true
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: /
          output_location: dist
          skip_app_build: true
      - uses: Azure/functions-action@v1.5.3
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: api
