name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix api
      - name: Validate and build
        run: npm run check && npm run check:api

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix api
      - name: Build production artifacts
        env:
          VITE_AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          VITE_AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED }}
          VITE_CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          VITE_APPROVED_FOOTER_TEXT: ${{ vars.APPROVED_FOOTER_TEXT }}
        run: npm run build && npm run build --prefix api
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: .
          api_location: api
          output_location: dist
          app_build_command: npm run build
          api_build_command: npm --prefix api run build

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix api
      - name: Build staging artifacts
        env:
          VITE_AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          VITE_AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED }}
          VITE_CONSENT_VERSION: ${{ vars.CONSENT_VERSION }}
          VITE_APPROVED_FOOTER_TEXT: ${{ vars.APPROVED_FOOTER_TEXT }}
        run: npm run build && npm run build --prefix api
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .
          api_location: api
          output_location: dist
          app_build_command: npm run build
          api_build_command: npm --prefix api run build

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          action: close
          app_location: dist
